<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- La landing es oscura de punta a punta: la barra del navegador en el
         celular se pinta del mismo color que el fondo para que no quede una
         franja blanca arriba de la página. -->
    <meta name="theme-color" content="#05080f" />

    <title>Freewheel — Alquilá el auto de un vecino. O ganá con el tuyo.</title>
    <meta
      name="description"
      content="Freewheel es la plataforma argentina de alquiler de autos entre particulares: identidad verificada con IA, reservas con calendario real, retiro y devolución con QR, chat con notas de voz y soporte en cinco idiomas."
    />

    <!-- Al compartir el link por WhatsApp o subirlo a una presentación, esto es
         lo que se ve en la tarjeta de vista previa. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Freewheel — Alquiler de autos entre particulares" />
    <meta
      property="og:description"
      content="Publicá tu auto y ganá con él, o alquilá el de un vecino. Identidad verificada, pagos y entrega con QR."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- La fuente se precarga: el navegador la empieza a bajar en paralelo con
         el HTML, en vez de esperar a leer el CSS para descubrir que la
         necesita. Son unos 300ms menos de texto con la tipografía equivocada. -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- El volante es la marca. Se precarga acá como dato embebido para que el
         ícono de la pestaña aparezca sin un pedido extra al servidor. -->
  </head>
  <body>
    <!-- ANTIPARPADEO. Este script corre ANTES de que se pinte nada: lee el tema
         y el idioma guardados y los escribe en el <html> al instante. Sin esto,
         alguien con el modo oscuro elegido vería la página un momento en blanco
         y después saltaría a oscuro. Va en línea, y no importado, porque un
         archivo aparte se descargaría después del primer pintado. -->
    <script>
      (function () {
        var root = document.documentElement;

        try {
          var t = localStorage.getItem("fw-theme");
          if (t === "dark" || t === "light") {
            root.setAttribute("data-theme", t);
          } else {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0f141c" : "#ffffff");
        } catch (e) { /* si falla, queda el modo claro */ }

        // El idioma. Acá no hay parpadeo que evitar —los textos los pone React,
        // que todavía no corrió— pero el atributo lang del <html> tiene que
        // estar bien desde el primer momento: es lo que leen el traductor
        // automático del navegador y los lectores de pantalla, y los dos miran
        // el documento apenas carga.
        try {
          var langs = ["es", "en", "pt", "it", "zh"];
          var l = localStorage.getItem("fw-lang");
          if (langs.indexOf(l) === -1) {
            l = null;
            var list = navigator.languages || [navigator.language || "es"];
            for (var i = 0; i < list.length && !l; i++) {
              var base = String(list[i] || "").toLowerCase().split("-")[0];
              if (langs.indexOf(base) !== -1) l = base;
            }
          }
          root.setAttribute("lang", l || "es");
        } catch (e) { /* queda el lang="es" del HTML */ }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
