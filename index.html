<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- La landing es oscura de punta a punta: la barra del navegador en el
         celular se pinta del mismo color que el fondo para que no quede una
         franja blanca arriba de la página. -->
    <meta name="theme-color" content="#05080f" />

    <title>Freewheel — Alquilá el auto de un vecino. O ganá con el tuyo.</title>
    <meta
      name="description"
      content="Freewheel es la plataforma argentina de alquiler de autos entre particulares: identidad verificada con IA, reservas con calendario real, retiro y devolución con QR, chat con notas de voz y soporte en cinco idiomas."
    />

    <!-- Al compartir el link por WhatsApp o subirlo a una presentación, esto es
         lo que se ve en la tarjeta de vista previa. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Freewheel — Alquiler de autos entre particulares" />
    <meta
      property="og:description"
      content="Publicá tu auto y ganá con él, o alquilá el de un vecino. Identidad verificada, pagos y entrega con QR."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- El volante es la marca. Se precarga acá como dato embebido para que el
         ícono de la pestaña aparezca sin un pedido extra al servidor. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
