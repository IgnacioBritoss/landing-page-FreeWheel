<!--
  El ícono de la pestaña: SOLO el pin, sin el cuadrado negro de fondo.

  Va en el azul de la marca y no en blanco: sacado el cuadrado, un dibujo blanco
  sobre transparente desaparece en una pestaña clara, que es donde más se mira.
  El azul se lee sobre fondo claro y sobre fondo oscuro.

  Es el mismo trazado que el componente Logo, así el ícono y la marca son
  literalmente el mismo dibujo y no dos parecidos: el pin con el volante
  centrado en su cabeza redonda.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 53">
  <g fill="#0f6ce6">
    <path fill-rule="evenodd" d="M20 2C10.6 2 3 9.6 3 19C3 31.75 20 50.6 20 50.6C20 50.6 37 31.75 37 19C37 9.6 29.4 2 20 2ZM20 5.8a13.2 13.2 0 1 0 0 26.4a13.2 13.2 0 1 0 0-26.4Z"/>
    <path fill="none" stroke="#0f6ce6" stroke-width="2.7" d="M30.2 19a10.2 10.2 0 1 1-20.4 0a10.2 10.2 0 1 1 20.4 0Z"/>
    <rect x="8.45" y="17.75" width="23.1" height="2.5" rx="1.25"/>
    <rect x="18.75" y="19" width="2.5" height="11.55" rx="1.25"/>
    <circle cx="20" cy="19" r="2.6"/>
  </g>
</svg>
